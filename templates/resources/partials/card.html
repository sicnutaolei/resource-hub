<article class="software-card">
  <a class="software-card__link" href="{{ resource.get_absolute_url }}">
    <div class="software-card__media">
      {% if resource.cover_image %}
        <img src="{{ resource.thumbnail_url }}" alt="" width="640" height="400" loading="lazy" decoding="async">
      {% else %}
        <div class="software-card__placeholder" aria-hidden="true">
          <span>{{ resource.title|slice:":1" }}</span>
        </div>
      {% endif %}
      {% if not resource.is_public %}
        <span class="badge badge--private">非公开</span>
      {% endif %}
    </div>
    <h3 class="software-card__title" title="{{ resource.title }}">{{ resource.title }}</h3>
  </a>
</article>
