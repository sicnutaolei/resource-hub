<div class="field {% if field.errors %}has-error{% endif %}">
  <label class="field__label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %}<span class="req">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="field__help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="field__error">{{ field.errors.0 }}</div>{% endif %}
</div>
